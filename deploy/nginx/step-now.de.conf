# HTTPS — used after certbot issues certs
# Access-log format without the query string: the admin WebSocket carries its JWT as ?token=,
# and $request would write that token to disk. Used by the /ws location below.
log_format stepnow_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name step-now.de www.step-now.de api.step-now.de;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name step-now.de www.step-now.de;
    ssl_certificate     /etc/letsencrypt/live/step-now.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/step-now.de/privkey.pem;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        # X-Real-IP is overwritten here (never client-supplied); the Next.js BFF forwards it to the
        # API as X-Forwarded-For so per-visitor rate limits and audit IPs work.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
server {
    listen 443 ssl http2;
    server_name api.step-now.de;
    ssl_certificate     /etc/letsencrypt/live/step-now.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/step-now.de/privkey.pem;
    client_max_body_size 25m;
    # Admin realtime socket (FastAPI /ws). Long-lived upgrade; the 25 s client ping keeps it under
    # the read timeout. Logged via $uri only, so the ?token= JWT never reaches the access log.
    location = /ws {
        access_log /var/log/nginx/access.log stepnow_noquery;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
